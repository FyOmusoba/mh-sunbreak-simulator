<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>護石編集</title>
</head>

<body>

    <h1>護石編集</h1>

    <form th:action="@{/talisman-apply}"
          th:object="${simulatorForm}"
          method="get">

        <!-- ============================== -->
        <!-- 武器 -->
        <!-- ============================== -->

        <input type="hidden" th:field="*{weaponId}">

        <input type="hidden" th:field="*{weaponDecoration1Id}">
        <input type="hidden" th:field="*{weaponDecoration2Id}">
        <input type="hidden" th:field="*{weaponDecoration3Id}">


        <!-- ============================== -->
        <!-- 頭 -->
        <!-- ============================== -->

        <input type="hidden" th:field="*{headArmorId}">

        <input type="hidden" th:field="*{headDecoration1Id}">
        <input type="hidden" th:field="*{headDecoration2Id}">
        <input type="hidden" th:field="*{headDecoration3Id}">


        <!-- ============================== -->
        <!-- 胴 -->
        <!-- ============================== -->

        <input type="hidden" th:field="*{chestArmorId}">

        <input type="hidden" th:field="*{chestDecoration1Id}">
        <input type="hidden" th:field="*{chestDecoration2Id}">
        <input type="hidden" th:field="*{chestDecoration3Id}">


        <!-- ============================== -->
        <!-- 腕 -->
        <!-- ============================== -->

        <input type="hidden" th:field="*{armArmorId}">

        <input type="hidden" th:field="*{armDecoration1Id}">
        <input type="hidden" th:field="*{armDecoration2Id}">
        <input type="hidden" th:field="*{armDecoration3Id}">


        <!-- ============================== -->
        <!-- 腰 -->
        <!-- ============================== -->

        <input type="hidden" th:field="*{waistArmorId}">

        <input type="hidden" th:field="*{waistDecoration1Id}">
        <input type="hidden" th:field="*{waistDecoration2Id}">
        <input type="hidden" th:field="*{waistDecoration3Id}">


        <!-- ============================== -->
        <!-- 脚 -->
        <!-- ============================== -->

        <input type="hidden" th:field="*{legArmorId}">

        <input type="hidden" th:field="*{legDecoration1Id}">
        <input type="hidden" th:field="*{legDecoration2Id}">
        <input type="hidden" th:field="*{legDecoration3Id}">


        <!-- ============================== -->
        <!-- 護石に装着中の装飾品 -->
        <!-- ============================== -->

        <input type="hidden" th:field="*{talismanDecoration1Id}">
        <input type="hidden" th:field="*{talismanDecoration2Id}">
        <input type="hidden" th:field="*{talismanDecoration3Id}">


        <!-- ============================== -->
        <!-- 護石スキル1 -->
        <!-- ============================== -->

        <h2>スキル1</h2>

        <label>スキル：</label>

        <select th:field="*{talismanSkill1Id}">

            <option value="">
                なし
            </option>

            <option th:each="skill : ${skills}"
                    th:value="${skill.skillId}"
                    th:text="${skill.skillName}">
            </option>

        </select>

        <label>Lv：</label>

        <input type="number"
               th:field="*{talismanSkill1Level}"
               min="1"
               max="7">

        <br>
        <br>


        <!-- ============================== -->
        <!-- 護石スキル2 -->
        <!-- ============================== -->

        <h2>スキル2</h2>

        <label>スキル：</label>

        <select th:field="*{talismanSkill2Id}">

            <option value="">
                なし
            </option>

            <option th:each="skill : ${skills}"
                    th:value="${skill.skillId}"
                    th:text="${skill.skillName}">
            </option>

        </select>

        <label>Lv：</label>

        <input type="number"
               th:field="*{talismanSkill2Level}"
               min="1"
               max="7">

        <br>
        <br>


        <!-- ============================== -->
        <!-- 護石スロット -->
        <!-- ============================== -->

        <h2>スロット</h2>

        <!--
            実際にSimulatorFormへ送信する値。
            下の「スロット構成」選択時にJavaScriptで設定する。
        -->

        <input type="hidden"
               th:field="*{talismanSlot1Size}">

        <input type="hidden"
               th:field="*{talismanSlot2Size}">

        <input type="hidden"
               th:field="*{talismanSlot3Size}">


        <label for="talismanSlotPattern">
            スロット構成：
        </label>

        <select id="talismanSlotPattern">

            <option value="0-0-0">0-0-0</option>

            <option value="1-0-0">1-0-0</option>
            <option value="1-1-0">1-1-0</option>
            <option value="1-1-1">1-1-1</option>

            <option value="2-0-0">2-0-0</option>
            <option value="2-1-0">2-1-0</option>
            <option value="2-1-1">2-1-1</option>
            <option value="2-2-0">2-2-0</option>
            <option value="2-2-1">2-2-1</option>
            <option value="2-2-2">2-2-2</option>

            <option value="3-0-0">3-0-0</option>
            <option value="3-1-0">3-1-0</option>
            <option value="3-1-1">3-1-1</option>
            <option value="3-2-0">3-2-0</option>
            <option value="3-2-1">3-2-1</option>
            <option value="3-3-0">3-3-0</option>
            <option value="3-3-1">3-3-1</option>

            <option value="4-0-0">4-0-0</option>
            <option value="4-1-0">4-1-0</option>
            <option value="4-1-1">4-1-1</option>

        </select>

        <br>
        <br>

        <button type="submit">
            この護石を設定
        </button>

    </form>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const slot1
                    = document.getElementById(
                        "talismanSlot1Size"
                    );

                const slot2
                    = document.getElementById(
                        "talismanSlot2Size"
                    );

                const slot3
                    = document.getElementById(
                        "talismanSlot3Size"
                    );

                const patternSelect
                    = document.getElementById(
                        "talismanSlotPattern"
                    );


                function getSlotValue(slot) {

                    if (slot.value === "") {
                        return "0";
                    }

                    return slot.value;
                }


                function applyPattern(pattern) {

                    const values
                        = pattern.split("-");

                    slot1.value
                        = values[0];

                    slot2.value
                        = values[1];

                    slot3.value
                        = values[2];
                }


                const currentPattern
                    = getSlotValue(slot1)
                    + "-"
                    + getSlotValue(slot2)
                    + "-"
                    + getSlotValue(slot3);


                const patternExists
                    = Array.from(
                        patternSelect.options
                    ).some(
                        option =>
                            option.value
                            === currentPattern
                    );


                if (patternExists) {

                    patternSelect.value
                        = currentPattern;

                } else {

                    patternSelect.value
                        = "0-0-0";

                    applyPattern(
                        "0-0-0"
                    );
                }


                patternSelect.addEventListener(
                    "change",
                    function () {

                        applyPattern(
                            patternSelect.value
                        );
                    }
                );
            }
        );

    </script>

</body>

</html>
