<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>武器詳細</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

    <h1>武器詳細</h1>

    <table border="1">

        <tr>
            <th>武器名</th>
            <td th:text="${weapon.weaponName}"></td>
        </tr>

        <tr>
            <th>武器種</th>
            <td th:text="${weapon.weaponType}"></td>
        </tr>

        <tr>
            <th>攻撃力</th>
            <td th:text="${weapon.attack}"></td>
        </tr>

        <tr>
            <th>属性</th>
            <td th:text="${weapon.elementType}"></td>
        </tr>

        <tr>
            <th>属性値</th>
            <td th:text="${weapon.elementValue}"></td>
        </tr>

        <tr>
            <th>会心率</th>
            <td th:text="${weapon.affinity} + '%'"></td>
        </tr>

        <tr>
            <th>防御力ボーナス</th>
            <td th:text="${weapon.defenseBonus}"></td>
        </tr>

        <tr>
            <th>百竜装飾品スロット</th>
            <td th:text="${weapon.rampageSlotSize}"></td>
        </tr>

        <tr>
            <th>スロット1</th>
            <td th:text="${weapon.slot1Size}"></td>
        </tr>

        <tr>
            <th>スロット2</th>
            <td th:text="${weapon.slot2Size}"></td>
        </tr>

        <tr>
            <th>スロット3</th>
            <td th:text="${weapon.slot3Size}"></td>
        </tr>

        <tr>
            <th>最大斬れ味</th>
            <td th:text="${weapon.maxSharpnessColor}"></td>
        </tr>

    </table>

    <br>


    <!-- ================================================== -->
    <!-- この武器を選択 -->
    <!-- ================================================== -->

    <button type="button"
            th:data-weapon-id="${weapon.weaponId}"
            onclick="selectWeapon(
                this.dataset.weaponId
            )">

        この武器を選択

    </button>


    <br>
    <br>


    <!-- ================================================== -->
    <!-- 武器一覧へ戻る -->
    <!-- ================================================== -->

    <button type="button"
            onclick="backToWeaponList()">

        武器一覧へ戻る

    </button>


    <script>

        /*
         * =====================================================
         * この武器を選択
         * =====================================================
         *
         * 現在URLのシミュレーター状態をそのまま維持し、
         * weaponIdだけ今回選択した武器へ変更する。
         *
         * 武器固有の設定については、
         * SimulatorController側で新しい武器に使用可能か
         * 判定され、使用できないものは自動的に解除される。
         */
        function selectWeapon(
                weaponId) {

            if (!weaponId) {
                return;
            }


            const url
                    = new URL(
                            window.location.href
                    );


            /*
             * シミュレーターへ戻る。
             */
            url.pathname
                    = "/simulator";


            /*
             * 今回選択した武器へ変更。
             */
            url.searchParams.set(
                    "weaponId",
                    weaponId
            );


            /*
             * weaponTypeは武器一覧だけで使う
             * 絞り込み用パラメータなので、
             * シミュレーターへ戻る際は削除する。
             */
            url.searchParams.delete(
                    "weaponType"
            );


            window.location.href
                    = url.toString();
        }


        /*
         * =====================================================
         * 武器一覧へ戻る
         * =====================================================
         *
         * 詳細画面へ来た時点のURLをそのまま使う。
         *
         * そのため、
         *
         * monsterId
         * hitzoneId
         * rampageDecorationId
         * bowChargeId
         * bowCoatingId
         * bowgunAmmoId
         * 防具
         * 装飾品
         * 護石
         * skillState_xxx
         * weaponType
         *
         * をすべて維持したまま一覧へ戻れる。
         */
        function backToWeaponList() {

            const url
                    = new URL(
                            window.location.href
                    );


            url.pathname
                    = "/weapon-list";


            window.location.href
                    = url.toString();
        }

    </script>

</body>

</html>
