<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>武器一覧</title>
</head>

<body>

    <h1>武器一覧</h1>


    <!-- ================================================== -->
    <!-- 武器種絞り込み -->
    <!-- ================================================== -->

    <form id="weaponFilterForm"
          th:action="@{/weapon-list}"
          method="get"
          onsubmit="return filterWeaponList()">

        <label for="weaponTypeSelect">
            武器種：
        </label>

        <select id="weaponTypeSelect"
                name="weaponType">

            <option value=""
                    th:selected="${selectedWeaponType == null
                        or selectedWeaponType == ''}">
                すべて
            </option>

            <option value="大剣"
                    th:selected="${selectedWeaponType == '大剣'}">
                大剣
            </option>

            <option value="太刀"
                    th:selected="${selectedWeaponType == '太刀'}">
                太刀
            </option>

            <option value="片手剣"
                    th:selected="${selectedWeaponType == '片手剣'}">
                片手剣
            </option>

            <option value="双剣"
                    th:selected="${selectedWeaponType == '双剣'}">
                双剣
            </option>

            <option value="ハンマー"
                    th:selected="${selectedWeaponType == 'ハンマー'}">
                ハンマー
            </option>

            <option value="狩猟笛"
                    th:selected="${selectedWeaponType == '狩猟笛'}">
                狩猟笛
            </option>

            <option value="ランス"
                    th:selected="${selectedWeaponType == 'ランス'}">
                ランス
            </option>

            <option value="ガンランス"
                    th:selected="${selectedWeaponType == 'ガンランス'}">
                ガンランス
            </option>

            <option value="スラッシュアックス"
                    th:selected="${selectedWeaponType == 'スラッシュアックス'}">
                スラッシュアックス
            </option>

            <option value="チャージアックス"
                    th:selected="${selectedWeaponType == 'チャージアックス'}">
                チャージアックス
            </option>

            <option value="操虫棍"
                    th:selected="${selectedWeaponType == '操虫棍'}">
                操虫棍
            </option>

            <option value="弓"
                    th:selected="${selectedWeaponType == '弓'}">
                弓
            </option>

            <option value="ライトボウガン"
                    th:selected="${selectedWeaponType == 'ライトボウガン'}">
                ライトボウガン
            </option>

            <option value="ヘビィボウガン"
                    th:selected="${selectedWeaponType == 'ヘビィボウガン'}">
                ヘビィボウガン
            </option>

        </select>

        <button type="submit">
            絞り込み
        </button>

    </form>


    <br>


    <!-- ================================================== -->
    <!-- 武器一覧 -->
    <!-- ================================================== -->

    <table border="1">

        <thead>

            <tr>
                <th>武器名</th>
                <th>武器種</th>
                <th>攻撃力</th>
                <th>属性</th>
                <th>属性値</th>
                <th>会心率</th>
                <th>選択</th>
            </tr>

        </thead>

        <tbody>

            <tr th:each="weapon : ${weapons}">

                <td th:text="${weapon.weaponName}">
                </td>

                <td th:text="${weapon.weaponType}">
                </td>

                <td th:text="${weapon.attack}">
                </td>

                <td th:text="${weapon.elementType}">
                </td>

                <td th:text="${weapon.elementValue}">
                </td>

                <td th:text="${weapon.affinity} + '%'">
                </td>

                <td>

                    <button type="button"
                            th:data-weapon-id="${weapon.weaponId}"
                            onclick="goWeaponDetail(
                                this.dataset.weaponId
                            )">

                        選択

                    </button>

                </td>

            </tr>

        </tbody>

    </table>


    <script>

        /*
         * =====================================================
         * 武器種絞り込み
         * =====================================================
         *
         * 現在URLをそのまま利用することで、
         *
         * monsterId
         * hitzoneId
         * rampageDecorationId
         * bowChargeId
         * bowCoatingId
         * bowgunAmmoId
         * 防具
         * 装飾品
         * 護石
         * skillState_xxx
         *
         * などをすべて維持する。
         */
        function filterWeaponList() {

            const weaponTypeSelect
                    = document.getElementById(
                            "weaponTypeSelect"
                    );

            if (!weaponTypeSelect) {
                return false;
            }


            const url
                    = new URL(
                            window.location.href
                    );


            url.pathname
                    = "/weapon-list";


            const weaponType
                    = weaponTypeSelect.value;


            if (weaponType) {

                url.searchParams.set(
                        "weaponType",
                        weaponType
                );

            } else {

                url.searchParams.delete(
                        "weaponType"
                );
            }


            window.location.href
                    = url.toString();


            return false;
        }


        /*
         * =====================================================
         * 武器詳細画面へ
         * =====================================================
         *
         * 武器詳細へ進む場合も、
         * 現在URLのシミュレーター状態を
         * そのまま持っていく。
         */
        function goWeaponDetail(
                weaponId) {

            if (!weaponId) {
                return;
            }


            const url
                    = new URL(
                            window.location.href
                    );


            url.pathname
                    = "/weapon/"
                    + weaponId;


            /*
             * weaponTypeは武器一覧の絞り込み状態として
             * そのまま残しておく。
             *
             * 武器詳細から一覧へ戻った場合にも、
             * 同じ絞り込み状態を復元しやすくするため。
             */


            window.location.href
                    = url.toString();
        }

    </script>

</body>

</html>
