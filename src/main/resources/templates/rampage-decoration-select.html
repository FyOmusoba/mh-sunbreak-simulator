<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>百竜装飾品選択</title>

</head>

<body>

    <h1>百竜装飾品選択</h1>


    <p>
        使用できる百竜スロットサイズ：
        <span th:text="${slotSize}"></span>
    </p>


    <table border="1">

        <thead>

            <tr>

                <th>装飾品名</th>

                <th>百竜スキル</th>

                <th>必要スロット</th>

                <th>選択</th>

            </tr>

        </thead>


        <tbody>

            <tr th:each="rampageDecoration : ${rampageDecorations}">

                <td th:text="${rampageDecoration.decorationName}">
                </td>

                <td th:text="${rampageDecoration.rampageSkillName}">
                </td>

                <td th:text="${rampageDecoration.requiredSlotSize}">
                </td>


                <td>

                    <button type="button"
                            th:data-rampage-decoration-id="${rampageDecoration.rampageDecorationId}"
                            onclick="applyRampageDecoration(
                                this.dataset.rampageDecorationId
                            )">

                        選択

                    </button>

                </td>

            </tr>

        </tbody>

    </table>


    <script>

        /*
         * =====================================================
         * 百竜装飾品を適用
         * =====================================================
         *
         * 現在URLに存在するシミュレーター状態を
         * すべて維持したまま
         * /rampage-decoration-apply へ移動する。
         *
         * これにより、
         *
         * weaponId
         * monsterId
         * hitzoneId
         * bowChargeId
         * bowCoatingId
         * bowgunAmmoId
         * 各防具ID
         * 各装飾品ID
         * 護石
         * skillState_xxx
         *
         * などを個別に列挙する必要がなくなる。
         */
        function applyRampageDecoration(
                rampageDecorationId) {

            if (!rampageDecorationId) {
                return;
            }


            /*
             * 現在のURLをそのままコピーする。
             */
            const url
                    = new URL(
                            window.location.href
                    );


            /*
             * 遷移先だけ変更する。
             */
            url.pathname
                    = "/rampage-decoration-apply";


            /*
             * 今回選択した百竜装飾品を設定する。
             */
            url.searchParams.set(
                    "rampageDecorationId",
                    rampageDecorationId
            );


            /*
             * 現在持っているその他のパラメータは
             * 一切削除せず、そのまま維持する。
             */
            window.location.href
                    = url.toString();
        }

    </script>

</body>

</html>
