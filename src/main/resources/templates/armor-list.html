<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>防具一覧</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

    <h1>防具一覧</h1>


    <!-- ================================================== -->
    <!-- 部位絞り込み -->
    <!-- ================================================== -->

    <label for="partSelect">
        部位：
    </label>

    <select id="partSelect">

        <option value=""
                th:selected="${selectedPart == null or selectedPart == ''}">
            すべて
        </option>

        <option value="頭"
                th:selected="${selectedPart == '頭'}">
            頭
        </option>

        <option value="胴"
                th:selected="${selectedPart == '胴'}">
            胴
        </option>

        <option value="腕"
                th:selected="${selectedPart == '腕'}">
            腕
        </option>

        <option value="腰"
                th:selected="${selectedPart == '腰'}">
            腰
        </option>

        <option value="脚"
                th:selected="${selectedPart == '脚'}">
            脚
        </option>

    </select>

    <button type="button"
            onclick="filterArmorList()">
        絞り込み
    </button>


    <br>
    <br>


    <!-- ================================================== -->
    <!-- 防具なし -->
    <!-- ================================================== -->

    <p th:if="${armors == null or #lists.isEmpty(armors)}">
        防具がありません。
    </p>


    <!-- ================================================== -->
    <!-- 防具一覧 -->
    <!-- ================================================== -->

    <table border="1"
           th:if="${armors != null and !#lists.isEmpty(armors)}">

        <thead>

            <tr>
                <th>防具名</th>
                <th>部位</th>
                <th>防御力</th>
                <th>スキル</th>
                <th>スロット1</th>
                <th>スロット2</th>
                <th>スロット3</th>
                <th>選択</th>
            </tr>

        </thead>

        <tbody>

            <!--
                armorがnullの場合は
                中身を一切評価しない。
            -->
            <th:block th:each="armor : ${armors}">

                <tr th:if="${armor != null}">

                    <td th:text="${armor.armorName}">
                    </td>

                    <td th:text="${armor.part}">
                    </td>

                    <td th:text="${armor.defense}">
                    </td>


                    <!-- ====================================== -->
                    <!-- スキル -->
                    <!-- ====================================== -->

                    <td>

                        <div th:if="${armor.skill1Name != null}">

                            <span th:text="${armor.skill1Name}">
                            </span>

                            Lv<span th:text="${armor.skill1Level}">
                            </span>

                        </div>


                        <div th:if="${armor.skill2Name != null}">

                            <span th:text="${armor.skill2Name}">
                            </span>

                            Lv<span th:text="${armor.skill2Level}">
                            </span>

                        </div>


                        <div th:if="${armor.skill3Name != null}">

                            <span th:text="${armor.skill3Name}">
                            </span>

                            Lv<span th:text="${armor.skill3Level}">
                            </span>

                        </div>


                        <div th:if="${armor.skill4Name != null}">

                            <span th:text="${armor.skill4Name}">
                            </span>

                            Lv<span th:text="${armor.skill4Level}">
                            </span>

                        </div>

                    </td>


                    <!-- ====================================== -->
                    <!-- スロット -->
                    <!-- ====================================== -->

                    <td th:text="${armor.slot1Size != null
                        ? armor.slot1Size
                        : 0}">
                    </td>

                    <td th:text="${armor.slot2Size != null
                        ? armor.slot2Size
                        : 0}">
                    </td>

                    <td th:text="${armor.slot3Size != null
                        ? armor.slot3Size
                        : 0}">
                    </td>


                    <!-- ====================================== -->
                    <!-- 選択 -->
                    <!-- ====================================== -->

                    <td>

                        <button type="button"
                                th:data-armor-id="${armor.armorId}"
                                onclick="goArmorDetail(
                                    this.dataset.armorId
                                )">

                            選択

                        </button>

                    </td>

                </tr>

            </th:block>

        </tbody>

    </table>


    <script>

        /*
         * =====================================================
         * 部位絞り込み
         * =====================================================
         *
         * 現在のURLをそのまま使用するため、
         *
         * 武器
         * モンスター
         * 部位
         * 防具
         * 装飾品
         * 護石
         * 条件付きスキル
         *
         * などの状態を維持する。
         */
        function filterArmorList() {

            const part
                    = document
                            .getElementById(
                                    "partSelect"
                            )
                            .value;


            const url
                    = new URL(
                            window.location.href
                    );


            url.pathname
                    = "/armor-list";


            if (part) {

                url.searchParams.set(
                        "part",
                        part
                );

            } else {

                url.searchParams.delete(
                        "part"
                );
            }


            window.location.href
                    = url.toString();
        }


        /*
         * =====================================================
         * 防具詳細へ
         * =====================================================
         *
         * URLに入っている現在のシミュレーター状態を
         * すべて維持したまま移動する。
         */
        function goArmorDetail(
                armorId) {

            if (!armorId) {

                return;
            }


            const url
                    = new URL(
                            window.location.href
                    );


            url.pathname
                    = "/armor/"
                    + armorId;


            window.location.href
                    = url.toString();
        }

    </script>

</body>

</html>
