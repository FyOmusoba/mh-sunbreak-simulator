<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規登録</title>
</head>
<body>

    <h1>新規登録</h1>

    <p th:if="${error}"
       th:text="${error}">
    </p>

    <form th:action="@{/register}"
          th:object="${registerForm}"
          method="post">

        <div>
            <label>ユーザー名</label>
            <input type="text"
                   th:field="*{username}">
        </div>

        <div>
            <label>パスワード</label>
            <input type="password"
                   th:field="*{password}">
        </div>

        <div>
            <label>パスワード確認</label>
            <input type="password"
                   th:field="*{confirmPassword}">
        </div>

        <button type="submit">
            登録
        </button>

    </form>

</body>
</html>
