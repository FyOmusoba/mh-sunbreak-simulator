<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>装飾品選択</title>

</head>

<body>

    <h1>装飾品選択</h1>


    <p>
        使用できるスロットサイズ：
        <span th:text="${slotSize}">
        </span>
    </p>


    <table border="1">

        <thead>

            <tr>

                <th>スキル名</th>

                <th>付与Lv</th>

                <th>必要スロット</th>

                <th>選択</th>

            </tr>

        </thead>


        <tbody>

            <tr th:each="decoration : ${decorations}">

                <td th:text="${decoration.skillName}">
                </td>

                <td th:text="${decoration.skillLevel}">
                </td>

                <td th:text="${decoration.requiredSlotSize}">
                </td>


                <td>

                    <button type="button"
                            th:data-decoration-id="${decoration.decorationId}"
                            onclick="applyDecoration(
                                this.dataset.decorationId
                            )">

                        選択

                    </button>

                </td>

            </tr>

        </tbody>

    </table>


    <script>

        /*
         * =====================================================
         * 装飾品選択
         * =====================================================
         *
         * 現在URLにあるシミュレーター状態を
         * すべて維持したまま
         * decoration-applyへ移動する。
         *
         * これにより、
         *
         * monsterId
         * hitzoneId
         * 各防具ID
         * 各装飾品ID
         * skillState_xxx
         *
         * なども維持される。
         */
        function applyDecoration(
                decorationId) {

            const url
                    = new URL(
                            window.location.href
                    );

            url.pathname
                    = "/decoration-apply";


            url.searchParams.set(
                    "decorationId",
                    decorationId
            );


            /*
             * slotSizeは選択画面専用なので
             * 適用処理には不要。
             */
            url.searchParams.delete(
                    "slotSize"
            );


            window.location.href
                    = url.toString();
        }

    </script>

</body>

</html>
